<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガソリン・高速代台帳 - キャッスルハウス</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#EFEEE7;--surface:#FFFFFF;--surface-2:#F6F4EC;
    --ink:#1B2B29;--ink-soft:#5B6B67;--ink-faint:#8B978F;
    --line:#DBD6C8;--line-soft:#E8E4D7;
    --accent:#1F6F5C;--accent-strong:#154F42;--accent-soft:#E1EFEA;--accent-ink:#FFFFFF;
    --warn:#B4552F;--warn-soft:#F5E4DA;--warn-ink:#7C3A1F;
    --gas:#A97A1E;--toll:#35618C;
    --shadow:0 1px 2px rgba(27,43,41,.07),0 10px 26px -14px rgba(27,43,41,.28);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111B19;--surface:#17211F;--surface-2:#1D2926;
      --ink:#E9EEEB;--ink-soft:#A6B4AF;--ink-faint:#71827B;
      --line:#2A3936;--line-soft:#22302D;
      --accent:#42AD90;--accent-strong:#5AC4A6;--accent-soft:#1C332D;--accent-ink:#08120F;
      --warn:#DD8256;--warn-soft:#33251F;--warn-ink:#F3C6AD;
      --gas:#D2A745;--toll:#63A0D2;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -14px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{color:var(--ink);font-family:'Zen Kaku Gothic New',"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;padding:20px 14px 60px;margin:0;}
  .page{max-width:640px;margin:0 auto;}
  header{margin-bottom:18px;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-bottom:6px;}
  h1{font-family:'Shippori Mincho',serif;font-weight:700;font-size:clamp(23px,5.5vw,30px);line-height:1.3;margin:0 0 4px;}
  .whobar{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;}
  .whobar .who{font-weight:700;}
  .whobar .sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-faint);margin-left:auto;}
  .sync .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
  .sync.live .dot{background:var(--accent);}
  .sync.live{color:var(--accent);}
  .link-btn{background:none;border:none;font:inherit;font-size:12px;color:var(--ink-faint);cursor:pointer;padding:2px 4px;text-decoration:underline;}
  .link-btn:hover{color:var(--warn);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0;}
  .stat-tile{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;}
  .stat-tile .label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .stat-tile .value{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:999px;padding:4px;gap:4px;margin-bottom:18px;}
  .seg button{flex:1;padding:10px 12px;border:none;background:transparent;border-radius:999px;font:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .seg button.active{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .card h2{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;margin:0 0 16px;}
  .card p{font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.7;}
  form{display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  label .req{color:var(--warn);margin-left:2px;}
  input,select{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  input::placeholder{color:var(--ink-faint);}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;}
  .yen{position:relative;}
  .yen input{padding-left:30px;font-family:'JetBrains Mono',monospace;font-weight:700;}
  .yen::before{content:"¥";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-weight:700;}
  .field.gas label{color:var(--gas);}
  .field.toll label{color:var(--toll);}
  .btn-row{display:flex;gap:10px;margin-top:4px;}
  button.btn{font:inherit;font-weight:700;font-size:14px;padding:12px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
  button.btn:disabled{opacity:.5;cursor:not-allowed;}
  button.btn-primary{flex:2;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  button.btn-ghost{flex:1;}
  .hint{font-size:12px;color:var(--warn-ink);background:var(--warn-soft);border-radius:8px;padding:8px 10px;display:none;}
  .hint.show{display:block;}
  .filters{display:flex;gap:10px;margin-bottom:14px;}
  .sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .sum-row .nm{font-weight:700;}
  .sum-row .amts{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);text-align:right;}
  .sum-row .amts b{color:var(--ink);font-size:14px;}
  .sec-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin:22px 0 10px;}
  .history-list{display:flex;flex-direction:column;gap:8px;}
  .history-item{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;}
  .hi-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
  .hi-date{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;}
  .hi-amts{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
  .hi-amts b{font-family:'JetBrains Mono',monospace;color:var(--ink);}
  .hi-amts .g{color:var(--gas);font-weight:700;}
  .hi-amts .t{color:var(--toll);font-weight:700;}
  .hi-foot{display:flex;justify-content:flex-end;margin-top:6px;}
  .confirm-row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--warn-ink);}
  .confirm-row button{font:inherit;font-size:12px;font-weight:700;border:none;background:none;cursor:pointer;padding:2px 6px;}
  .confirm-row .yes{color:var(--warn);}
  .confirm-row .no{color:var(--ink-faint);}
  .empty{text-align:center;color:var(--ink-faint);padding:30px 10px;font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.err{background:var(--warn);color:#fff;}
  .offline-banner{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:16px;display:none;}
  .offline-banner.show{display:block;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">キャッスルハウス</div>
    <h1>ガソリン・高速代台帳</h1>
    <div class="whobar" id="whoBar" hidden>
      <span class="who" id="whoName"></span><span>さんの記録</span>
      <button type="button" class="link-btn" id="changeNameBtn">名前を変更</button>
      <span class="sync" id="syncIndicator"><span class="dot"></span><span id="syncLabel">接続中…</span></span>
    </div>
  </header>

  <div class="panel" id="panelSetup">
    <div class="card">
      <h2>はじめにお名前を入力</h2>
      <p>入力した名前の分だけが表示されます。この端末に記憶されるので、次回からは入力不要です。毎回同じ表記(例：藤岡)で入力してください。</p>
      <form id="setupForm" novalidate>
        <div class="field">
          <label for="fSetupName">お名前<span class="req">*必須</span></label>
          <input type="text" id="fSetupName" placeholder="例：藤岡" autocomplete="off">
        </div>
        <div class="hint" id="setupHint">お名前を入力してください。</div>
        <div class="btn-row"><button type="submit" class="btn btn-primary">はじめる</button></div>
      </form>
    </div>
  </div>

  <div id="mainArea" hidden>
    <div class="offline-banner" id="offlineBanner">共有シートに接続できませんでした。しばらくしてから再読み込みしてください。</div>

    <div class="stats">
      <div class="stat-tile"><div class="label">今月の合計</div><div class="value" id="statTotal">–</div></div>
      <div class="stat-tile"><div class="label">今月のガソリン代</div><div class="value" id="statGas" style="color:var(--gas)">–</div></div>
      <div class="stat-tile"><div class="label">今月の高速代</div><div class="value" id="statToll" style="color:var(--toll)">–</div></div>
    </div>

    <div class="seg">
      <button type="button" id="tabBtnNew" class="active">入力する</button>
      <button type="button" id="tabBtnHistory">履歴・集計</button>
    </div>

    <div class="panel active" id="panelNew">
      <div class="card">
        <h2>今日の分を入力</h2>
        <form id="recordForm" novalidate>
          <div class="field">
            <label for="fDate">日付<span class="req">*必須</span></label>
            <input type="date" id="fDate">
          </div>
          <div class="field gas">
            <label for="fGas">ガソリン代</label>
            <div class="yen"><input type="number" id="fGas" inputmode="numeric" placeholder="0" min="0"></div>
          </div>
          <div class="field toll">
            <label for="fToll">高速代</label>
            <div class="yen"><input type="number" id="fToll" inputmode="numeric" placeholder="0" min="0"></div>
          </div>
          <div class="hint" id="formHint">日付と、ガソリン代か高速代のどちらか(または両方)を入力してください。</div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="resetBtn">リセット</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">保存する</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel" id="panelHistory">
      <div class="card">
        <h2>集計と履歴</h2>
        <div class="filters"><select id="filterMonth" aria-label="対象月"></select></div>
        <div id="summary"></div>
        <div class="sec-title">履歴</div>
        <div class="history-list" id="historyList"><div class="empty">読み込み中…</div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoR6mqGtu6EynKwrH9gJhVFQiMYsA3_DIZhAYgHsJpKG-Gnhn8DtfxdaMFfvbIPubFhg/exec';
  const NAME_KEY = 'gtl_my_name';

  let myName = '';
  let records = [];
  let loaded = false;
  let filterMonth = null;
  let pendingDelete = null;
  let timer = null;

  const $ = id => document.getElementById(id);

  function normName(s){ return String(s || '').replace(/\s+/g, ''); }
  function todayStr(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  const CUR_YM = todayStr().slice(0,7);
  filterMonth = CUR_YM;

  function yen(n){ return '¥' + Math.round(Number(n)||0).toLocaleString('ja-JP'); }
  function ymLabel(ym){ return ym.slice(0,4) + '年' + Number(ym.slice(5,7)) + '月'; }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function toast(msg, isErr){
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.className = 'toast'; }, 2600);
  }

  function getSavedName(){
    try { return localStorage.getItem(NAME_KEY) || ''; } catch(e){ return ''; }
  }
  function saveName(n){
    try { localStorage.setItem(NAME_KEY, n); } catch(e){}
  }
  function clearName(){
    try { localStorage.removeItem(NAME_KEY); } catch(e){}
  }

  function showSetup(){
    clearInterval(timer);
    myName = '';
    records = [];
    loaded = false;
    $('whoBar').hidden = true;
    $('mainArea').hidden = true;
    $('panelSetup').classList.add('active');
    $('fSetupName').value = '';
    $('setupHint').classList.remove('show');
  }

  function showMain(){
    $('panelSetup').classList.remove('active');
    $('mainArea').hidden = false;
    $('whoBar').hidden = false;
    $('whoName').textContent = myName;
    $('fDate').value = todayStr();
    loaded = false;
    renderStats();
    renderHistory();
    loadRecords();
    clearInterval(timer);
    timer = setInterval(loadRecords, 15000);
  }

  $('setupForm').addEventListener('submit', function(e){
    e.preventDefault();
    const n = $('fSetupName').value.trim();
    if(!n){ $('setupHint').classList.add('show'); return; }
    myName = n;
    saveName(n);
    showMain();
  });

  $('changeNameBtn').addEventListener('click', function(){
    clearName();
    showSetup();
  });

  function switchTab(tab){
    $('tabBtnNew').classList.toggle('active', tab==='new');
    $('tabBtnHistory').classList.toggle('active', tab==='history');
    $('panelNew').classList.toggle('active', tab==='new');
    $('panelHistory').classList.toggle('active', tab==='history');
  }
  $('tabBtnNew').addEventListener('click', function(){ switchTab('new'); });
  $('tabBtnHistory').addEventListener('click', function(){ switchTab('history'); });

  $('resetBtn').addEventListener('click', function(){
    $('recordForm').reset();
    $('fDate').value = todayStr();
    $('formHint').classList.remove('show');
  });

  $('recordForm').addEventListener('submit', function(e){
    e.preventDefault();
    const date = $('fDate').value;
    const gas = Number($('fGas').value) || 0;
    const toll = Number($('fToll').value) || 0;

    if(!date || (gas <= 0 && toll <= 0)){
      $('formHint').classList.add('show');
      return;
    }
    $('formHint').classList.remove('show');

    const data = { date: date, staff: myName, gas: gas, toll: toll };

    $('saveBtn').disabled = true;
    $('saveBtn').textContent = '保存中…';
    apiPost(data).then(function(res){
      if(res && res.ok){
        $('recordForm').reset();
        $('fDate').value = todayStr();
        toast('保存しました');
        loadRecords();
      }else{
        toast('保存に失敗しました。もう一度お試しください。', true);
      }
    }).catch(function(){
      toast('保存に失敗しました。通信環境をご確認ください。', true);
    }).finally(function(){
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = '保存する';
    });
  });

  $('filterMonth').addEventListener('change', function(e){ filterMonth = e.target.value; renderHistory(); });

  function apiGet(){
    return fetch(SCRIPT_URL + '?_=' + Date.now(), { method:'GET' }).then(function(r){ return r.json(); });
  }
  function apiPost(payload){
    return fetch(SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); });
  }

  function doDelete(id){
    pendingDelete = null;
    apiPost({action:'delete', id:id}).then(function(){
      toast('削除しました');
      loadRecords();
    }).catch(function(){
      toast('削除に失敗しました', true);
    });
  }

  function renderStats(){
    let g = 0, t = 0;
    records.forEach(function(r){
      if(r.date && r.date.slice(0,7) === CUR_YM){ g += Number(r.gas)||0; t += Number(r.toll)||0; }
    });
    $('statTotal').textContent = loaded ? yen(g + t) : '–';
    $('statGas').textContent = loaded ? yen(g) : '–';
    $('statToll').textContent = loaded ? yen(t) : '–';

    const set = {}; set[CUR_YM] = true;
    records.forEach(function(r){ if(r.date) set[r.date.slice(0,7)] = true; });
    const months = Object.keys(set).sort().reverse();
    $('filterMonth').innerHTML = months.map(function(m){
      return '<option value="' + m + '">' + ymLabel(m) + '</option>';
    }).join('');
    $('filterMonth').value = months.indexOf(filterMonth) !== -1 ? filterMonth : CUR_YM;
  }

  function renderHistory(){
    if(!loaded){
      $('summary').innerHTML = '';
      $('historyList').innerHTML = '<div class="empty">読み込み中…</div>';
      return;
    }
    const list = records.filter(function(r){ return (r.date||'').slice(0,7) === filterMonth; });
    let tg = 0, tt = 0;
    list.forEach(function(r){ tg += Number(r.gas)||0; tt += Number(r.toll)||0; });

    $('summary').innerHTML = '<div class="sum-row"><span class="nm">' + ymLabel(filterMonth) + 'の合計</span><span class="amts">ガソリン ' + yen(tg) + ' ／ 高速 ' + yen(tt) + '　<b>' + yen(tg + tt) + '</b></span></div>';

    if(list.length === 0){
      $('historyList').innerHTML = '<div class="empty">この月の記録はまだありません</div>';
      return;
    }
    $('historyList').innerHTML = list.map(function(r){
      const isPending = pendingDelete === r.id;
      let h = '<div class="history-item"><div class="hi-top"><div class="hi-date">' + (r.date || '') + '</div></div>';
      h += '<div class="hi-amts"><span><span class="g">ガソリン</span> <b>' + yen(r.gas) + '</b></span><span><span class="t">高速</span> <b>' + yen(r.toll) + '</b></span></div>';
      h += '<div class="hi-foot">';
      if(isPending){
        h += '<span class="confirm-row">本当に削除しますか？<button class="yes" data-yes="' + r.id + '">削除する</button><button class="no" data-no="1">キャンセル</button></span>';
      }else{
        h += '<button class="link-btn" data-del="' + r.id + '">削除</button>';
      }
      return h + '</div></div>';
    }).join('');

    Array.prototype.forEach.call($('historyList').querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){ pendingDelete = b.getAttribute('data-del'); renderHistory(); });
    });
    Array.prototype.forEach.call($('historyList').querySelectorAll('[data-yes]'), function(b){
      b.addEventListener('click', function(){ doDelete(b.getAttribute('data-yes')); });
    });
    Array.prototype.forEach.call($('historyList').querySelectorAll('[data-no]'), function(b){
      b.addEventListener('click', function(){ pendingDelete = null; renderHistory(); });
    });
  }

  function loadRecords(){
    const who = myName;
    apiGet().then(function(data){
      if(who !== myName) return;
      if(!Array.isArray(data)) throw new Error('bad response');
      records = data.filter(function(r){ return normName(r.staff) === normName(who); })
        .sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || String(b.createdAt||'').localeCompare(String(a.createdAt||'')); });
      loaded = true;
      $('offlineBanner').classList.remove('show');
      $('syncIndicator').classList.add('live');
      $('syncLabel').textContent = '同期済み';
      renderStats();
      renderHistory();
    }).catch(function(){
      $('offlineBanner').classList.add('show');
      $('syncIndicator').classList.remove('live');
      $('syncLabel').textContent = '同期エラー';
    });
  }

  const saved = getSavedName();
  if(saved){ myName = saved; showMain(); } else { showSetup(); }
})();
</script>
</body>
</html>
